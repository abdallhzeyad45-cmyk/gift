<!DOCTYPE html>

<title>هدية لزمزم ❤️</title>

    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff4f8);
    color: #5a263b;
}

.container {
    width: 90%;

    margin: 25px auto;

    padding: 25px;

audio {

img {
    width: 100%;
    display: block;
    margin: 15px 0;
    border-radius: 18px;
}

.footer {

    margin-top: 25px;

</p>

<p>
